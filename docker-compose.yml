version: "3.8"

services:
  # ── MongoDB Database ──
  mongo:
    image: mongo:7
    container_name: deped-sms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - deped-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Go Backend API Server ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deped-sms-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=production
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=deped_sms
      - JWT_SECRET=${JWT_SECRET:-deped-sms-production-secret-change-me-2025}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - SEMAPHORE_API_KEY=${SEMAPHORE_API_KEY:-}
      - SMS_SENDER_NAME=${SMS_SENDER_NAME:-DepEdSMS}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - deped-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── React Frontend + Nginx ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deped-sms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deped-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  deped-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
